<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>여행안내 사이트에 오신 것을 환영합니다.</title>
    <style>
        #handin { font-size: 25pt; }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const startDate = document.getElementById('startdate');
            const endDate = document.getElementById('enddate');
            const period = document.getElementById('period');
            const desti = document.getElementById('desti');

            const resultSchedule = document.getElementById('result-schedule');
            const resultDesti = document.getElementById('result-desti');
            const resultRecommend = document.getElementById('result-recommend');

            // 목적지별 샘플 추천 코스
            const sampleCourses = {
                gyeong: '1일차: 첨성대, 대릉원, 황리단길 / 2일차: 불국사, 석굴암',
                gyeoryong: '1일차: 계룡산 동학사 탐방로, 갑사 / 2일차: 자연휴양림 산책',
                seolak: '1일차: 설악산 케이블카, 권금성 / 2일차: 신흥사, 속초 중앙시장'
            };

            function getDaysDiff() {
                if (!startDate.value || !endDate.value) return null;

                const start = new Date(startDate.value);
                const end = new Date(endDate.value);
                const diffDays = (end - start) / (1000 * 60 * 60 * 24);
                return diffDays;
            }

            function calculatePeriod() {
                const diffDays = getDaysDiff();

                if (diffDays === null) {
                    period.textContent = '-';
                    return;
                }

                if (diffDays < 0) {
                    period.textContent = '날짜를 확인하세요';
                    return;
                }

                period.textContent = `${diffDays + 1}일 (${diffDays}박 ${diffDays + 1}일)`;
            }

            startDate.addEventListener('change', calculatePeriod);
            endDate.addEventListener('change', calculatePeriod);

            // 전역에서도 호출할 수 있도록 window에 연결
            window.scheduleSubmit = function () {
                const diffDays = getDaysDiff();
                const selectedValue = desti.value;
                const selectedText = desti.options[desti.selectedIndex].text;

                if (diffDays === null || diffDays < 0) {
                    alert('출발일과 도착일을 올바르게 선택해 주세요.');
                    return;
                }

                if (!selectedValue) {
                    alert('여행지를 선택해 주세요.');
                    return;
                }

                alert('여행추천을 시작합니다.');

                // 각 영역의 div에 값 넣기
                resultSchedule.textContent = `${startDate.value} ~ ${endDate.value} (${diffDays + 1}일 / ${diffDays}박 ${diffDays + 1}일)`;
                resultDesti.textContent = selectedText;
                resultRecommend.textContent = sampleCourses[selectedValue] || '추천 일정을 준비 중입니다.';

                // 실제 Django 서버(/index/)로 POST 전송까지 하려면 아래 주석 해제
                // document.getElementById('schedule').submit();
            };
        });
    </script>
</head>
<body>
    <h1>여행일정</h1>
    <hr>
    <p>기간과 목적지를 선택하시면, 여행코스를 일정에 맞게 짜드립니다.</p>
    <hr>

    <form method="post" action="/index/" name="schedule" id="schedule">
        {% csrf_token %}
        <ul id="handin">
            <li>
                <label for="startdate">출발일</label>
                <input type="date" id="startdate" name="startdate"> ~
                <label for="enddate">도착일</label>
                <input type="date" id="enddate" name="enddate">
                일정기간 : <span id="period">-</span>
            </li>
            <li>
                <label for="desti">여행지</label>
                <select id="desti" name="desti">
                    <option value="">여행지</option>
                    <option value="gyeong">경주</option>
                    <option value="gyeoryong">계룡산</option>
                    <option value="seolak">설악산</option>
                </select>
            </li>
            <li>
                <button type="button" onclick="scheduleSubmit()">제출</button>
            </li>
        </ul>
    </form>

    <hr>

    <h1>여행일정 추천 결과</h1>
    <div id="tour">
        <h3>여행일정</h3>
        <div id="result-schedule">여기 일정이 표시됩니다.</div>

        <h3>목적지</h3>
        <div id="result-desti">목적지</div>

        <h3>추천 일정</h3>
        <h4>1일차</h4>
        <div id="result-recommend">1일차 일정이 표시됩니다.</div>
        <h4>2일차</h4>
        <div id="result-recommend">2일 일정이 표시됩니다.</div>
        <h4>숙소</h4>
        <div id="result-recommend">추천 일정이 표시됩니다.</div>
    </div>
</body>
</html>
